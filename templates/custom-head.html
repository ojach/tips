<style>
  .balloon {
    display: grid;
    grid-template-columns: 64px minmax(0, 1fr);
    gap: 14px;
    align-items: start;
    margin: 2rem 0;
  }

  .balloon__img {
    margin: 0;
    text-align: center;
  }

  .balloon__img > div {
    display: grid;
    width: 56px;
    aspect-ratio: 1;
    place-items: center;
    margin: 0 auto 6px;
    border-radius: 50%;
    background: #e7f3f0;
    color: #187a68;
    font-size: 1.4rem;
    font-weight: 700;
  }

  .balloon__img > div::before {
    content: "ア";
  }

  .balloon__name {
    color: #64748b;
    font-size: 0.75rem;
    line-height: 1.4;
  }

  .balloon__text {
    position: relative;
    margin: 4px 0 0;
    padding: 14px 18px;
    border: 1px solid #e5eaf0;
    border-radius: 14px;
    background: #f6f8f8;
    line-height: 1.8;
  }

  .balloon__text::before {
    position: absolute;
    top: 16px;
    left: -7px;
    width: 12px;
    height: 12px;
    border-bottom: 1px solid #e5eaf0;
    border-left: 1px solid #e5eaf0;
    background: #f6f8f8;
    content: "";
    transform: rotate(45deg);
  }

  .balloon__img > div img {
  display: block;
  width: 100%;
  height: 100%;
  border-radius: inherit;
  object-fit: cover;
}

.balloon__img > div:has(img)::before {
  content: none;
}

  @media (max-width: 560px) {
    .balloon {
      grid-template-columns: 52px minmax(0, 1fr);
      gap: 10px;
    }

    .balloon__img > div {
      width: 48px;
    }

    .balloon__text {
      padding: 12px 14px;
    }
  }
</style>
